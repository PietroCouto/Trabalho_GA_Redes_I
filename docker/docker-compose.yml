version: '3.8'

services:
  server1:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: Peer_A
    environment:
      - CONTAINER_NAME=Peer A
      - TERM=linux
    ports:
      - "1515:1515/udp"
    networks:
      net_a:
        ipv4_address: 172.21.0.2
      net_b:
        ipv4_address: 172.22.0.2
      net_c:
        ipv4_address: 172.23.0.2

  server2:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: Peer_B
    environment:
      - CONTAINER_NAME=Peer B
      - TERM=linux
    ports:
      - "1616:1616/udp"
    networks:
      net_a:
        ipv4_address: 172.21.0.3
      net_b:
        ipv4_address: 172.22.0.3
      net_c:
        ipv4_address: 172.23.0.3

  server3:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: Peer_C
    environment:
      - CONTAINER_NAME=Peer C
      - TERM=linux
    ports:
      - "1717:1717/udp"
    networks:
      net_a:
        ipv4_address: 172.21.0.4
      net_b:
        ipv4_address: 172.22.0.4
      net_c:
        ipv4_address: 172.23.0.4

networks:
  net_a:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
  net_b:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  net_c:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16